name: Release Multi-Arch Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: bumiayu-hall-linux-amd64
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            name: bumiayu-hall-linux-arm64
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            name: bumiayu-hall-windows-amd64.exe
            os: windows-latest
            cross: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation linker (ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Rust Binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "target/${{ matrix.target }}/release/bumiayu-hall.exe" ]; then
            cp "target/${{ matrix.target }}/release/bumiayu-hall.exe" "dist/${{ matrix.name }}"
          else
            cp "target/${{ matrix.target }}/release/bumiayu-hall" "dist/${{ matrix.name }}"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
